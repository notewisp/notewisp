# Builds, signs and uploads a release when a version tag (v0.2.0, ...) is pushed.
#
# The release is created as a DRAFT: installed apps can't see it until you press
# "Publish release" on GitHub. Install the draft's files yourself first; that's staging.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload files to it

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # NSIS .exe (updates itself) and .msi
          - os: ubuntu-22.04 # AppImage (updates itself), .deb and .rpm; older Ubuntu = runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version. Bump it with 'npm version'."
            exit 1
          fi

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The update stamp: without these the build fails instead of shipping unsigned updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NoteWisp ${{ github.ref_name }}
          releaseBody: |
            Download NoteWisp from https://notewisp.github.io/ or pick a file below.
            Already installed? The Windows installer and the AppImage update themselves.
          releaseDraft: true
          prerelease: false
          # latest.json points Windows at the NSIS installer, the format that updates itself.
          updaterJsonPreferNsis: true
